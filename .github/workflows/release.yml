name: Release

# 打 v* 标签即自动构建 Windows 安装包（安装版 + 绿色版）并发布到 Releases；
# 发布说明从 CHANGELOG.md 对应版本的条目生成，无需手工维护。
# 也可以在 Actions 页面手动触发（仅构建，不发布，用于验证打包）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 校验标签与 package.json 版本一致
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("v$version" -ne "${{ github.ref_name }}") {
              throw "标签 ${{ github.ref_name }} 与 package.json 的版本 $version 不一致"
            }
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 安装依赖
        run: npm ci

      # 与本地同一条路径：npm run dist = 类型检查 + 构建 + electron-builder
      # （scripts/dist.cjs 在 CI 上不设国内镜像、也不让 electron-builder 自己发布）
      - name: 构建安装版与绿色版
        run: npm run dist

      - name: 检查产物
        shell: pwsh
        run: |
          $expected = @(
            "release/EnvHub-$env:VERSION-setup.exe",
            "release/EnvHub-$env:VERSION-portable.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "缺少产物：$file" }
            "产物 $(Split-Path $file -Leaf)：$((Get-Item $file).Length) 字节"
          }

      - name: 检查产物
        shell: pwsh
        run: |
          $expected = @(
            "release/EnvHub-$env:VERSION-setup.exe",
            "release/EnvHub-$env:VERSION-portable.exe"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path $file)) { throw "缺少产物：$file" }
            "产物 $(Split-Path $file -Leaf)：$((Get-Item $file).Length) 字节"
          }

      - name: 失败时上传诊断信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            release/builder-debug.yml
            release/*.log
          if-no-files-found: ignore

      - name: 生成发布说明
        run: node scripts/release-notes.cjs $env:VERSION --out release-notes.md

      - name: 发布到 Releases
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:VERSION"
          $assets = @(
            "release/EnvHub-$env:VERSION-setup.exe",
            "release/EnvHub-$env:VERSION-portable.exe"
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag $assets --title "EnvHub $env:VERSION" --notes-file release-notes.md
          }
