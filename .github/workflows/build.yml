name: Build

# 运行标题：默认显示提交信息（开发用语），这里改成中性写法。
run-name: 构建检查 ${{ github.ref_name }}

# 日常提交的快速校验：类型检查 + 编译（不打安装包，几秒钟出结果）。
# 标签触发的完整打包与发布见 release.yml。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts 跳过 electron 的二进制下载：类型检查与 vite 编译都不需要它。
      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 类型检查与构建
        run: npm run build

      # 只保留最近一次构建记录，避免 Actions 列表堆积历史条目与开发用的提交信息
      - name: 清理历史运行记录
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $current = "${{ github.run_id }}"
          $ids = gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?per_page=100" --jq ".workflow_runs[] | select(.id != $current) | .id"
          foreach ($id in $ids) {
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" | Out-Null
            "已删除历史运行 $id"
          }
